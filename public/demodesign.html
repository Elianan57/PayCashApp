<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash App - Payment Invoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cash-green: #00D632;
            --bg-dark: #000000;
            --card-bg: #111111;
            --text-main: #FFFFFF;
            --text-dim: #8E8E93;
            --border-color: #2C2C2E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #000000;
            background-image:
                radial-gradient(circle at 50% -20%, rgba(0, 255, 65, 0.18) 0%, transparent 70%),
                radial-gradient(circle at -10% 50%, rgba(0, 255, 65, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 110% 50%, rgba(0, 255, 65, 0.1) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Payment Container */
        .phone-frame {
            width: 100%;
            max-width: 100%;
            background: transparent;
            border-radius: 0;
            position: relative;
            overflow: hidden;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            border: none;
        }

        /* Status Bar / Top Area */
        .status-bar {
            height: 0;
            display: none;
        }

        .header {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border-bottom: none;
        }

        .profile-icon {
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .app-name {
            color: white;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Scrollable Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: #444 transparent;
        }

        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        /* Payment Card */
        .payment-card {
            background-color: transparent;
            border-radius: 0;
            margin: 0;
            padding: 32px 24px;
            border: none;
            text-align: center;
        }

        .section-label {
            color: var(--cash-green);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .countdown {
            color: white;
            font-size: 32px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background-color: rgba(0, 214, 50, 0.1);
            width: 100%;
            margin-bottom: 24px;
        }

        .amount-section {
            margin-bottom: 24px;
        }

        .amount-label {
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .amount-value {
            color: white;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* QR Badge */
        .scan-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 214, 50, 0.1);
            color: var(--cash-green);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 214, 50, 0.2);
        }

        .qr-container {
            width: 200px;
            height: 200px;
            background: white;
            margin: 0 auto;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        /* Invoice Details Table */
        .details-table {
            width: 100%;
            border-top: 1px solid rgba(0, 214, 50, 0.15);
            text-align: left;
        }

        .detail-row {
            padding: 16px 0;
            border-bottom: 1px solid rgba(0, 214, 50, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label {
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
        }

        .detail-value {
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-align: right;
        }

        .lightning-address {
            font-family: monospace;
            font-size: 10px;
            color: var(--text-dim);
            display: block;
            margin-top: 4px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            background: #1C1C1E;
            border: 1px solid #333;
            color: var(--cash-green);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .copy-btn.copied {
            background: var(--cash-green);
            color: #000;
        }

        /* Status Footer */
        .status-footer {
            padding: 32px 24px;
            text-align: center;
        }

        .status-text {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--cash-green);
            border-radius: 50%;
            animation: dot-pulse 1.5s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Bottom Action */
        .bottom-action {
            padding: 24px;
            background-color: transparent;
            border-top: none;
        }

        .pay-button {
            background-color: var(--cash-green);
            color: white;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .pay-button:active {
            transform: scale(0.98);
        }

        .cash-logo-small {
            background: white;
            color: var(--cash-green);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 14px;
            flex-shrink: 0;
        }

        .pending-tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
            margin-left: 8px;
        }

        /* Responsive */
        @media (max-height: 800px) {
            .phone-frame {
                height: 90vh;
                width: calc(90vh * 0.48);
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="status-bar">
            <!-- Notch area or blank for simplicity -->
        </div>

        <div class="header">
            <div class="profile-icon">
                <img src="/logo.png" alt="Cash App Logo" />
            </div>
            <div class="app-name">Cash App</div>
        </div>

        <div class="content">
            <div class="payment-card">
                <div class="section-label">Time Remaining</div>
                <div class="countdown" id="timer">
                    <span id="minutes">00</span>
                    <span style="opacity: 0.5;">:</span>
                    <span id="seconds">00</span>
                </div>

                <div class="divider"></div>

                <div class="amount-section">
                    <div class="amount-label">Amount Due</div>
                    <div class="amount-value" id="amountValue">$0.00</div>
                </div>

                <div class="scan-badge">
                    <svg width="10" height="12" viewBox="0 0 10 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9.5 4.5H5.5L6.5 0.5L0.5 7.5H4.5L3.5 11.5L9.5 4.5Z" fill="currentColor"/>
                    </svg>
                    SCAN WITH CASH APP
                </div>

                <div class="qr-container">
                    <img id="qrCode" src="" alt="Payment QR Code" />
                </div>

                <div class="details-table">
                    <div class="detail-row">
                        <div class="detail-label">Invoice</div>
                        <div class="detail-value" id="invoiceId">—</div>
                    </div>
                    <div class="detail-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                            <div class="detail-label">Lightning invoice</div>
                            <button class="copy-btn" id="copyLightning">Copy</button>
                        </div>
                        <div class="lightning-address" id="lightningInvoice">—</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">On-chain (fallback)</div>
                        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                            <div class="lightning-address" id="onchainAddress">—</div>
                            <button class="copy-btn" id="copyOnchain">Copy</button>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Expires</div>
                        <div class="detail-value" style="font-size: 12px;" id="expiresAt">—</div>
                    </div>
                </div>
            </div>

            <div class="status-footer" id="statusFooter">
                <div class="status-text" id="statusText">Awaiting payment confirmation</div>
                <div class="loading-dots" id="loadingDots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div class="bottom-action">
            <button class="pay-button" id="payBtn">
                <div class="cash-logo-small">$</div>
                Pay with Cash App
                <span class="pending-tag">PENDING</span>
            </button>
        </div>
    </div>

    <script>
        // Extract chargeId from URL path
        const chargeId = window.location.pathname.split("/").pop();

        // Extract encoded data from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        let chargeData = null;

        if (encodedData) {
            try {
                chargeData = JSON.parse(atob(encodedData));
                console.log(`📦 Decoded charge data:`, chargeData);
            } catch (e) {
                console.error('Failed to decode data:', e);
            }
        }

        let timeRemaining = 3600;
        let paymentChecking = true;

        // DOM elements
        const timerMinutes = document.getElementById("minutes");
        const timerSeconds = document.getElementById("seconds");
        const amountValue = document.getElementById("amountValue");
        const invoiceId = document.getElementById("invoiceId");
        const lightningInvoice = document.getElementById("lightningInvoice");
        const onchainAddress = document.getElementById("onchainAddress");
        const expiresAt = document.getElementById("expiresAt");
        const qrCode = document.getElementById("qrCode");
        const statusText = document.getElementById("statusText");
        const payButton = document.querySelector(".pay-button");

        // Initialize on page load
        function initializePayment() {
            try {
                if (!chargeData) {
                    statusText.textContent = "No payment data received";
                    return;
                }

                console.log(`✅ Using passed charge data`);
                timeRemaining = chargeData.ttl || 3600;

                // Populate fields from passed data (no API call needed)
                const amount = chargeData.amount || 0;
                const currency = chargeData.currency || 'USD';
                amountValue.textContent = `$${parseFloat(amount).toFixed(2)}`;
                invoiceId.textContent = chargeId.substring(0, 12).toUpperCase();

                // Show truncated lightning invoice with dots
                if (chargeData.lightning_invoice) {
                    const inv = chargeData.lightning_invoice;
                    const truncated = inv.length > 20 ? `${inv.substring(0, 8)}...${inv.substring(inv.length - 6)}` : inv;
                    lightningInvoice.textContent = truncated;
                    lightningInvoice.title = inv;
                } else {
                    lightningInvoice.textContent = "—";
                }
                onchainAddress.textContent = chargeData.address || "—";

                // Generate QR code from full Cash App URL (scans directly into Cash App with amount)
                if (chargeData.lightning_invoice) {
                    const cashAppLink = `https://cash.app/launch/lightning/${chargeData.lightning_invoice}`;
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(cashAppLink)}`;
                    qrCode.src = qrUrl;
                }

                // Calculate expiration time
                const expiresDate = new Date(Date.now() + timeRemaining * 1000);
                expiresAt.textContent = expiresDate.toLocaleString();

                // Setup copy buttons
                document.getElementById("copyLightning").onclick = function() {
                    copyToClipboard(chargeData.lightning_invoice, this);
                };
                document.getElementById("copyOnchain").onclick = function() {
                    copyToClipboard(chargeData.address, this);
                };

                // Setup pay button - open in Cash App
                document.getElementById("payBtn").onclick = () => {
                    if (chargeData.lightning_invoice) {
                        window.location.href = `https://cash.app/launch/lightning/${encodeURIComponent(chargeData.lightning_invoice)}`;
                    }
                };

                // Start timer and polling
                startTimer();
                startPaymentPolling();
            } catch (error) {
                console.error("Init error:", error);
                statusText.textContent = "Error loading payment";
            }
        }

        function copyToClipboard(text, btn) {
            if (!text || text === "—") return;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "COPIED!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove("copied");
                }, 2000);
            }).catch(err => console.error('Copy failed:', err));
        }

        function startTimer() {
            const timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    paymentChecking = false;
                    statusText.textContent = "Payment expired";
                    return;
                }

                timeRemaining--;
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;

                timerMinutes.textContent = String(minutes).padStart(2, "0");
                timerSeconds.textContent = String(seconds).padStart(2, "0");
            }, 1000);
        }

        function startPaymentPolling() {
            const pollInterval = setInterval(async () => {
                if (!paymentChecking) {
                    clearInterval(pollInterval);
                    return;
                }

                try {
                    const response = await fetch(`/api/check-charge/${chargeId}`);
                    const data = await response.json();

                    if (data.paid) {
                        paymentChecking = false;
                        clearInterval(pollInterval);
                        statusText.textContent = "Payment received!";
                        document.getElementById("loadingDots").style.display = "none";

                        setTimeout(() => {
                            window.location.href = "/success";
                        }, 1500);
                    }
                } catch (error) {
                    console.error("Poll error:", error);
                }
            }, 3000);
        }

        // Initialize on load
        window.addEventListener("load", initializePayment);
    </script>

</body>
</html>
