<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Premium Checkout Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00D632;
            --bg-dark: #000000;
            --card-bg: rgba(13, 13, 13, 0.8);
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 214, 50, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 214, 50, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 440px;
            width: 100%;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 214, 50, 0.1);
            border: 1px solid rgba(0, 214, 50, 0.2);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 32px;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 60px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-stack {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: translateY(-5px);
        }

        .cash-logo {
            background: var(--primary);
        }

        .apple-logo {
            background: #FFFFFF;
        }

        .logo-box svg {
            width: 40px;
            height: 40px;
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #FFFFFF 0%, #AAAAAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 0;
            font-weight: 500;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #333333;
        }

        @media (max-width: 480px) {
            .card { padding: 40px 24px; }
            h1 { font-size: 36px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">
            <span class="status-dot"></span>
            System maintenance
        </div>

        <div class="card">
            <div class="logo-stack">
                <div class="logo-box cash-logo">
                    <!-- Bold White Dollar Sign -->
                    <svg viewBox="0 0 24 24" fill="white">
                        <path d="M11.8 21L11.8 18.9C9.7 18.7 8 17.5 7.2 15.6L9.6 14.6C10 15.6 10.9 16.3 11.8 16.4V12.9C10.1 12.5 8.3 11.7 8.3 9.4C8.3 7.5 9.8 6.2 11.8 6V4H13.2V6.1C14.8 6.3 16.1 7.3 16.7 8.7L14.4 9.7C14.1 9 13.6 8.5 13.1 8.4V11.8C15 12.3 16.7 13.1 16.7 15.5C16.7 17.6 15.1 18.9 13.2 19.1V21H11.8ZM13.1 16.4C13.8 16.3 14.3 15.9 14.3 15.4C14.3 14.8 13.8 14.5 13.1 14.2V16.4ZM11.8 10.6V8.4C11.2 8.5 10.7 8.9 10.7 9.4C10.7 10 11.2 10.3 11.8 10.6Z"/>
                    </svg>
                </div>
                <div class="logo-box apple-logo">
                    <!-- Black Apple Logo -->
                    <svg viewBox="0 0 384 512" fill="black">
                        <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-31.4-57.3-114.3-13.7-147.2zm-26.2-132c24-30 20.6-66 18-79.6-22.6 1.4-51.2 14.3-65.7 32-15.4 17.8-22.1 48.5-19.1 77.2 23.3 3.6 44.9-10.7 66.8-29.6z"/>
                    </svg>
                </div>
            </div>

            <h1>Coming soon</h1>
            <p>We are building something new for your payment experience. Check back shortly.</p>
        </div>
    </div>

    <div class="footer">
        © 2026 SECURE CHECKOUT
    </div>
</body>
</html>
