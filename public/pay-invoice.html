<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payment - CashApp 3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FF41;
            --bg-dark: #000000;
            --card-bg: #0D0D0D;
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --border-color: #1F1F1F;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, rgba(0, 255, 65, 0.18) 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }
        .header { text-align: center; margin-bottom: 32px; }
        .logo-circle {
            width: 64px; height: 64px;
            background-color: var(--primary);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
            margin: 0 auto 16px;
        }
        .logo-letter { color: #000; font-size: 32px; font-weight: 800; font-family: 'Outfit', sans-serif; }
        .header h1 { font-size: 24px; font-weight: 700; font-family: 'Outfit', sans-serif; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }
        .timer {
            background: rgba(0, 255, 65, 0.08);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
        }
        .timer-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .timer-display { font-size: 32px; font-weight: 700; font-family: 'Outfit', sans-serif; color: var(--primary); }
        .amount-section { text-align: center; margin-bottom: 32px; }
        .amount-label { font-size: 14px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
        .amount-display { font-size: 48px; font-weight: 700; font-family: 'Outfit', sans-serif; }
        .qr-container {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
        }
        .payment-info {
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .payment-info-row { display: flex; justify-content: space-between; padding: 8px 0; }
        .payment-info-label { color: var(--text-dim); font-size: 13px; }
        .payment-info-value { color: var(--primary); font-weight: 600; font-size: 12px; }
        .status-section { text-align: center; padding: 20px; background: rgba(0, 255, 65, 0.05); border-radius: 16px; margin-top: 24px; }
        .status-dot { display: inline-block; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .error-message { background: #ff3b30; color: white; padding: 12px 16px; border-radius: 16px; margin-bottom: 24px; display: none; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-circle"><span class="logo-letter">$</span></div>
        <h1>CashApp 3.0</h1>
    </div>
    <div class="error-message" id="errorMessage"></div>
    <div class="card">
        <div class="timer">
            <div class="timer-label">TIME REMAINING</div>
            <div class="timer-display" id="timerDisplay">59:59</div>
        </div>
        <div class="amount-section">
            <div class="amount-label">AMOUNT DUE</div>
            <div class="amount-display" id="amountDisplay">$0.00</div>
        </div>
        <div class="qr-container">
            <img id="qrCode" width="240" height="240" alt="QR Code" />
        </div>
        <div class="payment-info">
            <div class="payment-info-row">
                <span class="payment-info-label">Charge ID</span>
                <span class="payment-info-value" id="chargeId">Loading...</span>
            </div>
        </div>
        <div class="status-section">
            <div class="status-text">
                <span class="status-dot"></span>
                <span id="statusText">Waiting for payment...</span>
            </div>
        </div>
    </div>
    <script>
        const chargeId = window.location.pathname.split("/").pop();
        const urlParams = new URLSearchParams(window.location.search);
        const amountFromUrl = parseFloat(urlParams.get('amount')) || 0;
        const amountDisplay = document.getElementById("amountDisplay");
        const timerDisplay = document.getElementById("timerDisplay");
        const statusText = document.getElementById("statusText");
        const chargeIdDisplay = document.getElementById("chargeId");
        const errorMessage = document.getElementById("errorMessage");
        const qrCanvas = document.getElementById("qrCode");
        let timeRemaining = 3600;
        let paymentChecking = true;
        async function initializePayment() {
            try {
                chargeIdDisplay.textContent = chargeId;
                amountDisplay.textContent = `$${amountFromUrl.toFixed(2)}`;
                const response = await fetch(`/api/get-charge/${chargeId}`);
                const data = await response.json();
                if (data.success) {
                    timeRemaining = data.ttl || 3600;
                    generateQRCode(data.uri);
                    startPaymentPolling();
                    startTimer();
                } else {
                    showError("Failed to load payment details");
                }
            } catch (error) {
                console.error("Init error:", error);
                showError("Failed to load payment. Please refresh.");
            }
        }
        function generateQRCode(uri) {
            try {
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(uri)}`;
                qrCanvas.src = qrUrl;
            } catch (error) {
                console.error("QR error:", error);
            }
        }
        function startTimer() {
            const timerInterval = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    paymentChecking = false;
                    statusText.textContent = "Payment expired";
                    return;
                }
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, "0")}`;
            }, 1000);
        }
        function startPaymentPolling() {
            const pollInterval = setInterval(async () => {
                if (!paymentChecking) {
                    clearInterval(pollInterval);
                    return;
                }
                try {
                    const response = await fetch(`/api/check-charge/${chargeId}`);
                    const data = await response.json();
                    if (data.paid) {
                        paymentChecking = false;
                        clearInterval(pollInterval);
                        statusText.textContent = "Payment received!";
                        setTimeout(() => {
                            window.location.href = "/success";
                        }, 1000);
                    }
                } catch (error) {
                    console.error("Poll error:", error);
                }
            }, 3000);
        }
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }
        initializePayment();
    </script>
</body>
</html>
