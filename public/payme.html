<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pay CashApp 3.0 - Premium Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FF41; /* Slightly brighter green for 3.0 */
            --primary-dim: rgba(0, 255, 65, 0.12);
            --bg-dark: #000000;
            --card-bg: #0D0D0D;
            --input-bg: #151515;
            --input-bg-hover: #1a1a1a;
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --border-color: #1F1F1F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% -20%, rgba(0, 255, 65, 0.18) 0%, transparent 70%),
                radial-gradient(circle at -10% 50%, rgba(0, 255, 65, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 110% 50%, rgba(0, 255, 65, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        .header { text-align: center; margin-bottom: 32px; }

        .logo-wrapper {
            position: relative;
            width: 64px; height: 64px;
            margin: 0 auto 16px;
        }
        .logo-circle {
            width: 100%; height: 100%;
            background-color: var(--primary);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
            transform: rotate(-5deg);
        }
        .logo-letter {
            color: #000;
            font-size: 32px; font-weight: 800;
            font-family: 'Outfit', sans-serif;
            transform: rotate(5deg);
            line-height: 1;
        }
        .badge-3 {
            position: absolute;
            top: -5px; right: -10px;
            background: #fff; color: #000;
            font-size: 10px; font-weight: 800;
            padding: 2px 6px;
            border-radius: 100px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .header h1 {
            font-size: 26px; font-weight: 700;
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.5px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            width: 100%;
            max-width: 580px;
            padding: 0;
            overflow: visible;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }
        .card-content { padding: 32px; }

        .stepper {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 100px;
            padding: 4px;
            margin: 0 auto 32px;
            width: fit-content;
        }
        .step {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 28px;
            border-radius: 100px;
            font-size: 13px; font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }
        .step.active { background: var(--primary); color: #000; }

        .form-group { margin-bottom: 24px; }
        .form-label {
            display: block;
            font-size: 12px; font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            color: var(--text-main);
            font-size: 16px; font-weight: 500;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 65, 0.1);
        }
        .input-field::placeholder { color: #444; font-weight: 500; }

        /* ---------- Amount Input Styling ---------- */
        .amount-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 20px;
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            pointer-events: none;
        }

        .amount-input {
            padding-left: 45px;
            font-size: 28px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
        }

        /* Hide Number Spinners */
        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .amount-input[type=number] {
            -moz-appearance: textfield;
        }

        /* ---------- Quick Amount Chips ---------- */
        .quick-amounts-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-top: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quick-amounts-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .quick-amount-btn {
            padding: 10px 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 100px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quick-amount-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 255, 65, 0.05);
        }

        .quick-amount-btn.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 65, 0.3);
        }

        /* ---------- More Amounts Button ---------- */
        .more-amounts-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 100px;
            padding: 12px;
            color: var(--primary);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s ease;
            text-align: center;
        }

        .more-amounts-btn:hover {
            background: rgba(0, 255, 65, 0.08);
            border-color: var(--primary);
        }

        .extra-amounts {
            display: none;
            margin-top: 10px;
        }

        .extra-amounts.show {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-hint { font-size: 12px; color: var(--text-dim); margin-top: 10px; }

        .card-footer {
            padding: 20px 32px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        .footer-item {
            display: flex; align-items: center; gap: 10px;
            color: var(--text-dim);
            font-size: 14px; font-weight: 500;
        }
        .footer-item svg { width: 18px; height: 18px; color: var(--primary); }

        .main-button-container {
            width: 100%;
            max-width: 580px;
            margin-top: 24px;
        }
        .continue-button {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px; font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .continue-button:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 255, 65, 0.4);
        }
        .continue-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .loading-spinner {
            display: none;
            width: 24px; height: 24px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .continue-button.loading .button-text,
        .continue-button.loading svg { display: none; }
        .continue-button.loading .loading-spinner { display: block; }
        .continue-button svg { width: 20px; height: 20px; }

        .error-toast {
            background: #ff3b30;
            color: white;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 14px; font-weight: 600;
            margin-bottom: 24px;
            display: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 59, 48, 0.3);
            max-width: 580px;
            width: 100%;
        }

        @media (max-width: 480px) {
            body { padding: 20px; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
            .header { margin-bottom: 24px; }
            .header h1 { font-size: 22px; }
            .logo-wrapper { width: 56px; height: 56px; margin-bottom: 12px; }
            .logo-letter { font-size: 28px; }
            .badge-3 { font-size: 8px; padding: 1px 5px; right: -8px; }

            .card { border-radius: 24px; }
            .card-content { padding: 20px; }
            .stepper { margin-bottom: 24px; }
            .step { padding: 8px 20px; font-size: 12px; }
            
            .form-group { margin-bottom: 20px; }
            .amount-input { font-size: 20px; padding: 14px 20px 14px 45px; }
            .currency-symbol { font-size: 20px; left: 18px; }
            
            .quick-amount-btn { padding: 8px 14px; font-size: 13px; }
            .quick-amounts-grid { gap: 8px; }
            
            .main-button-container {
                position: fixed;
                bottom: calc(20px + env(safe-area-inset-bottom));
                left: 20px;
                right: 20px;
                width: calc(100% - 40px);
                z-index: 100;
                margin-top: 0;
            }
            .continue-button { padding: 16px; font-size: 16px; border-radius: 100px; }
            .error-toast.fixed-mobile {
                position: fixed;
                bottom: calc(90px + env(safe-area-inset-bottom));
                left: 20px;
                right: 20px;
                width: calc(100% - 40px);
                z-index: 99;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-wrapper">
            <div class="logo-circle">
                <span class="logo-letter">$</span>
            </div>
            <span class="badge-3">3.0</span>
        </div>
        <h1>CashApp 3.0</h1>
    </div>

    <div class="error-toast" id="errorMessage"></div>

    <div class="card">
        <div class="card-content">
            <div class="stepper">
                <div class="step active">Details</div>
                <div class="step">Secure Pay</div>
            </div>

            <form id="checkoutForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="amount">AMOUNT (USD)</label>
                    <div class="amount-input-wrapper">
                        <span class="currency-symbol">$</span>
                        <input type="number" id="amount" class="input-field amount-input" value="0" min="10" max="2000" step="1" required>
                    </div>
                    <div class="input-hint">Between 10 and 2,000 USD</div>
                    <div class="quick-amounts-label">Quick amounts</div>
                    <div class="quick-amounts-grid">
                        <button type="button" class="quick-amount-btn" data-amount="10">$10</button>
                        <button type="button" class="quick-amount-btn" data-amount="20">$20</button>
                        <button type="button" class="quick-amount-btn" data-amount="30">$30</button>
                        <button type="button" class="quick-amount-btn selected" data-amount="50">$50</button>
                    </div>

                    <button type="button" id="moreAmountsBtn" class="more-amounts-btn">More amounts</button>

                    <div id="extraAmounts" class="extra-amounts">
                        <button type="button" class="quick-amount-btn" data-amount="100">$100</button>
                        <button type="button" class="quick-amount-btn" data-amount="150">$150</button>
                        <button type="button" class="quick-amount-btn" data-amount="200">$200</button>
                        <button type="button" class="quick-amount-btn" data-amount="250">$250</button>
                        <button type="button" class="quick-amount-btn" data-amount="300">$300</button>
                        <button type="button" class="quick-amount-btn" data-amount="500">$500</button>
                        <button type="button" class="quick-amount-btn" data-amount="2000">$2000</button>
                    </div>

                    
                </div>
            </form>
        </div>

        <div class="card-footer">
            <div class="footer-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Bank Secure
            </div>
            <div class="footer-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Instant 3.0
            </div>
        </div>
    </div>

    <div class="main-button-container">
        <button type="submit" form="checkoutForm" class="continue-button" id="continueBtn">
            <span class="button-text">Pay with CashApp 3.0</span>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            <div class="loading-spinner"></div>
        </button>
    </div>

    <script>
        // ---------- Element refs ----------
        const form = document.getElementById('checkoutForm');
        const errorMessage = document.getElementById('errorMessage');
        const continueBtn = document.getElementById('continueBtn');
        const amountInput = document.getElementById('amount');
        const quickBtns = document.querySelectorAll('.quick-amount-btn');
        const moreAmountsBtn = document.getElementById('moreAmountsBtn');
        const extraAmounts = document.getElementById('extraAmounts');

        // ---------- Quick Amount Logic ----------
        quickBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = btn.dataset.amount;
                amountInput.value = amount;
                
                // Update selection state
                quickBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                
                // Clear error if selection made
                if (errorMessage.style.display === 'block') {
                    errorMessage.style.display = 'none';
                }
            });
        });

        // ---------- Custom Input Sync ----------
        amountInput.addEventListener('input', () => {
            let val = parseFloat(amountInput.value);
            
            // Cap at 2000
            if (val > 2000) {
                amountInput.value = 2000;
                val = 2000;
            }

            const currentVal = amountInput.value;
            // Unselect all chips if typing manually
            quickBtns.forEach(b => {
                if (b.dataset.amount === currentVal) {
                    b.classList.add('selected');
                } else {
                    b.classList.remove('selected');
                }
            });
        });

        // ---------- More Amounts Toggle ----------
        moreAmountsBtn.addEventListener('click', () => {
            extraAmounts.classList.toggle('show');
            moreAmountsBtn.textContent = extraAmounts.classList.contains('show') ? 'Fewer amounts' : 'More amounts';
        });

        // ---------- Form submission ----------
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            errorMessage.classList.remove('fixed-mobile');

            const amount = parseFloat(amountInput.value);

            if (!amount || isNaN(amount) || amount < 10) {
                showError('Minimum amount is $10');
                return;
            }
            if (amount > 2000) {
                showError('Maximum amount is $2,000');
                return;
            }

            continueBtn.classList.add('loading');
            continueBtn.disabled = true;

            try {
                const response = await fetch('https://ohkessuokmozfwldmqgs.supabase.co/functions/v1/opennode-payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_name: 'Guest',
                        customer_email: 'guest@cashap.shop',
                        amount: amount,
                        currency: 'USD'
                    })
                });

                const data = await response.json();

                if (data.success && data.charge_id) {
                    const encodedData = btoa(JSON.stringify(data));
                    window.location.href = `/pay/invoice/${data.charge_id}?data=${encodedData}`;
                } else {
                    showError(data.error || data.message || 'Connection failed. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Check your connection.');
            } finally {
                continueBtn.classList.remove('loading');
                continueBtn.disabled = false;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            if (window.innerWidth <= 480) {
                errorMessage.classList.add('fixed-mobile');
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
